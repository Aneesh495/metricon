[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "metricon-lab"
version = "2.0.0"
description = "Reproducible local learning analytics laboratory"
requires-python = ">=3.11,<3.14"
dependencies = [
 "numpy==2.2.6",
 "polars==1.32.3",
 "pyarrow==21.0.0",
 "duckdb==1.4.3",
 "scipy==1.15.3",
 "scikit-learn==1.7.1",
 "pydantic==2.11.7",
 "fastapi==0.116.1",
 "uvicorn==0.35.0",
 "python-multipart==0.0.20",
 "ijson==3.4.0",
 "httpx==0.28.1",
 "pytz==2025.2",
 "matplotlib==3.10.6",
]

[project.scripts]
metricon = "metricon.cli.main:main"

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/metricon"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "metricon/dependency.lock"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
