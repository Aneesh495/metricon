name: Full local research and scale campaign
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.18'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked --python 3.13
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: make bootstrap
      - run: make acceptance
      - run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-reports
          path: |
            .metricon/verification/ACCEPTANCE.json
            .metricon/verification/commands
            .metricon/verification/browser
            .metricon/verification/research/public.json
            .metricon/verification/synthetic/*.json
            .metricon/benchmark/*.json
